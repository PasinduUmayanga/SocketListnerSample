version: 1.0.{build}

image: Visual Studio 2022

environment:
  nodejs_version: "24"
  CI: true

install:
  - ps: Install-Product node $env:nodejs_version
  - node --version
  - npm --version
  - npm ci

build_script:
  - npm run build --workspace=@socketlistenersample/shared
  - npm run build --workspace=@socketlistenersample/server
  - npm run build --workspace=@socketlistenersample/client

test_script:
  - npm run test --workspace=@socketlistenersample/server
  - npm run test --workspace=@socketlistenersample/client

on_finish:
  - ps: >-
      Get-ChildItem -Path packages -Filter test-results.xml -Recurse -ErrorAction SilentlyContinue |
      ForEach-Object {
        Write-Host "Uploading test results: $($_.FullName)"
        (New-Object 'System.Net.WebClient').UploadFile("https://ci.appveyor.com/api/testresults/junit/$env:APPVEYOR_JOB_ID", $_.FullName)
      }

artifacts:
  - path: packages/client/dist
    name: socketlistenersample-build
  - path: packages/*/test-results.xml
    name: test-results

cache:
  - '%APPDATA%\npm-cache -> package-lock.json'
  - node_modules -> package-lock.json
